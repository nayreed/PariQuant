[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pariquant"
version = "0.1.0"
description = "Auditable resource-comparison accounting for the same workload on heterogeneous QPUs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]

[tool.setuptools]
packages = ["pariquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
